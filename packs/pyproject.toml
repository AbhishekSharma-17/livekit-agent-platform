[project]
name = "lkap-packs"
version = "0.1.0"
license = "Apache-2.0"
description = "LKAP use-case packs (generic, insurance_claim)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "livekit-agents==1.8.2",
  "lkap-contracts",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-timeout>=2.4",
  "ruff>=0.13",
  "mypy>=1.18",
  "lkap-testing",
]

[tool.uv.sources]
lkap-contracts = { path = "../contracts", editable = true }
lkap-testing = { path = "../testing", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packs"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

# TODO(W0-CONTRACTS): drop this once contracts/src/lkap_contracts/py.typed
# exists — the package is missing its PEP 561 marker, so mypy --strict
# otherwise reports `import-untyped` for every `lkap_contracts.*` import.
[[tool.mypy.overrides]]
module = "lkap_contracts.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: requires a live LiveKit Cloud connection",
  "slow: slow test, skipped by default in fast loops",
]
testpaths = ["tests"]
