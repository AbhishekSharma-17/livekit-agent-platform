# Postgres matrix for the api package (CONTRACTS-V2 §2: "All migrations must run
# on SQLite (dev) and Postgres (CI matrix)").
#
# Stub owned by V2-01: it covers the Postgres leg only. V2-09 owns `.github/**`
# and folds this job into its own `python.yml` matrix; until then this file is
# the single place that proves the v2 chain runs on a real server.
name: api-postgres

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - ".github/workflows/api-postgres.yml"

jobs:
  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lkap
          POSTGRES_PASSWORD: lkap
          POSTGRES_DB: lkap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lkap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Used by `tests/conftest.py::postgres_url` to point the whole suite at Postgres.
      LKAP_TEST_DATABASE_URL: postgresql+asyncpg://lkap:lkap@localhost:5432/lkap_test
      LKAP_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Migrate up, down and up again on Postgres
        working-directory: api
        env:
          LKAP_DATABASE_URL: postgresql+asyncpg://lkap:lkap@localhost:5432/lkap_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade 4135323c6ecc
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Run the api suite against Postgres
        working-directory: api
        run: uv run pytest -q -m "not live"
