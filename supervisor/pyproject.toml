[project]
name = "lkap-supervisor"
version = "0.1.0"
license = "Apache-2.0"
description = "LKAP worker supervisor: reconciles per-connection worker pools (subprocess or docker)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "lkap-contracts",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "prometheus-client>=0.21,<1",
  "docker>=7.1,<8",
  "redis>=5.2,<7",
]

[project.scripts]
lkap-supervisor = "lkap_supervisor.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-timeout>=2.4",
  "respx>=0.21,<1",
  "fakeredis[lua]>=2.26,<3",
  "ruff>=0.13",
  "mypy>=1.18",
  "types-docker>=7.1",
]

[tool.uv.sources]
lkap-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lkap_supervisor"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
markers = [
  "live: tests that need a running api / LiveKit (opt-in)",
  "slow: slow tests",
]
