[project]
name = "lkap-agent"
version = "0.1.0"
license = "Apache-2.0"
description = "LKAP LiveKit worker (agent_name=lkap-agent)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents[google,openai,deepgram,cartesia,elevenlabs,silero,bey,tavus,simli,mcp]==1.8.3",
  "livekit-plugins-google==1.8.3",
  "livekit-plugins-openai==1.8.3",
  "livekit-plugins-deepgram==1.8.3",
  "livekit-plugins-cartesia==1.8.3",
  "livekit-plugins-elevenlabs==1.8.3",
  "livekit-plugins-silero==1.8.3",
  "livekit-plugins-bey==1.8.3",
  "livekit-plugins-tavus==1.8.3",
  "livekit-plugins-simli==1.8.3",
  "livekit-api==1.2.1",
  "livekit==1.1.18",
  "google-genai>=1.30,<3",
  # DEVIATION from docs/CONTRACTS.md §2 (`openai>=1.100,<2`): livekit-agents==1.8.2
  # itself hard-requires `openai>=2,<3` (verified via `uv sync` resolver failure
  # and METADATA of the pinned wheel in the probe venv) — `>=1.100,<2` is
  # unsatisfiable alongside it. Flagged for the architect to correct in
  # CONTRACTS.md; not a behavioural fork, just the only installable pin.
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "pillow>=12.3,<13",
  "lkap-contracts",
  "lkap-packs",
  "phonenumbers>=9,<10",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-timeout>=2.4",
  "ruff>=0.13",
  "mypy>=1.18",
  "lkap-testing",
  "respx>=0.22",
]

[tool.uv.sources]
lkap-contracts = { path = "../contracts", editable = true }
lkap-packs = { path = "../packs", editable = true }
lkap-testing = { path = "../testing", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lkap_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: requires a live LiveKit Cloud connection",
  "slow: slow test, skipped by default in fast loops",
]
testpaths = ["tests"]
