[project]
name = "lkap-testing"
version = "0.1.0"
license = "Apache-2.0"
description = "Shared in-memory test fakes for LKAP packs and the worker (REVIEW-FINAL F-18)"
requires-python = ">=3.12,<3.13"
# `packs.base` (the Protocols these fakes implement) comes from `lkap-packs`,
# which every consumer already has: it is a runtime dependency of `lkap-agent`
# and the project itself in `packs/`. Declaring it here would make `packs`'
# dev group depend on itself, so it is only in this package's own dev group.
dependencies = [
  "livekit-agents==1.8.2",
  "pydantic>=2.11,<3",
  "lkap-contracts",
]

[dependency-groups]
dev = [
  "lkap-packs",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-timeout>=2.4",
  "ruff>=0.13",
  "mypy>=1.18",
]

[tool.uv.sources]
lkap-contracts = { path = "../contracts", editable = true }
lkap-packs = { path = "../packs", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lkap_testing"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: requires a live LiveKit Cloud connection",
  "slow: slow test, skipped by default in fast loops",
]
testpaths = ["tests"]
